name: Build Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Change wrapper permissions
        run: chmod +x gradlew

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          fi

      - name: Run unit tests (parsers)
        run: ./gradlew testReleaseUnitTest --no-daemon

      - name: Build Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk tabplayer.apk
          gh release create "${{ github.ref_name }}" \
            tabplayer.apk app/build/outputs/apk/release/app-release.apk \
            --title "Tab Player ${{ github.ref_name }}" \
            --notes "Tab Player — learn songs with staff notation + guitar tab in sync. Open .gp3/.gp4/.gp5/.gp (Guitar Pro 7)/.txt tab files, pick a track, and play it back at any speed with 5 sounds each for guitar, bass, drums and keyboard. Download tabplayer.apk and install it (allow installs from your browser/files app if asked)."
